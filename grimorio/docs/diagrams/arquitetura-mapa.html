<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitetura da tela de Mapa</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitetura · Grimório</p>
    <h1>Tela de Mapa: o que mora dentro do <em>&lt;Tldraw&gt;</em> e o que mora fora</h1>

    <svg viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONAS (antes das setas e dos nodes) ============ -->
      <rect x="40" y="96" width="240" height="192" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="52" y="100" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="96" y="109" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FORA DO TLDRAW</text>

      <rect x="640" y="272" width="400" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="756" y="276" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="840" y="285" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DENTRO · SLOTS DE COMPONENTS</text>

      <!-- ============ SETAS ============ -->
      <!-- MapaView -> camadas (estado) -->
      <line x1="440" y1="128" x2="440" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="452" y="150" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="478" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">ESTADO</text>

      <!-- camadas -> Tldraw (visibilidade) -->
      <line x1="440" y1="256" x2="440" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="452" y="274" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="283" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">VISIBILIDADE</text>

      <!-- camadas -> vaultRepo (salva) -->
      <line x1="560" y1="228" x2="636" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="576" y="208" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="598" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">SALVA</text>

      <!-- Tldraw -> MapaToolbar (mesma altura: reta) -->
      <line x1="560" y1="332" x2="660" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Tldraw -> ControleZoom -->
      <path d="M 560,356 H 604 Q 612,356 612,364 V 404 Q 612,412 620,412 H 660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Tldraw -> MapaOverlay -->
      <path d="M 560,380 H 620 Q 628,380 628,388 V 484 Q 628,492 636,492 H 660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- MapaOverlay -> MapaView (ponte de seleção via contexto) — rota externa, por cima -->
      <path d="M 1016,492 H 1048 Q 1056,492 1056,484 V 104 Q 1056,96 1048,96 H 564"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="776" y="76" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="808" y="85" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">SELEÇÃO</text>

      <!-- MapaView -> Painel de propriedades (entra pelo topo) -->
      <path d="M 320,80 H 176 Q 168,80 168,88 V 124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="224" y="56" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="65" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">PROPS</text>

      <!-- MapaView -> Painel de camadas (entra pela direita) -->
      <path d="M 320,112 H 300 Q 292,112 292,120 V 228 Q 292,236 284,236 H 268" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ NODES ============ -->
      <!-- MapaView (focal) -->
      <rect x="320" y="64" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="64" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="328" y="70" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="346" y="79" fill="rgba(235,108,54,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
      <text x="440" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MapaView</text>
      <text x="440" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">estado · editorRef · callbacks</text>

      <!-- camadas (atom) -->
      <rect x="320" y="200" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="200" width="240" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="328" y="206" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="346" y="215" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ATOM</text>
      <text x="440" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Camadas</text>
      <text x="440" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">atom() · identidade estável</text>

      <!-- vaultRepo -->
      <rect x="640" y="200" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="200" width="240" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="648" y="206" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="668" y="215" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISCO</text>
      <text x="760" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vaultRepo</text>
      <text x="760" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">salvarCamadasMapa()</text>

      <!-- <Tldraw> -->
      <rect x="320" y="312" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="312" width="240" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="328" y="318" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="344" y="327" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
      <text x="440" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">&lt;Tldraw&gt;</text>
      <text x="440" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user: snap local do mapa</text>
      <text x="440" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">getShapeVisibility</text>

      <!-- Painel de propriedades -->
      <rect x="56" y="128" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="128" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="64" y="134" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="84" y="143" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REACT</text>
      <text x="160" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Painel de propriedades</text>
      <text x="160" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">X · Y · L · A em quadrados</text>

      <!-- Painel de camadas -->
      <rect x="56" y="208" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="208" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="64" y="214" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="84" y="223" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REACT</text>
      <text x="160" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Painel de camadas</text>
      <text x="160" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">esconder · travar · ordem</text>

      <!-- MapaToolbar -->
      <rect x="664" y="304" width="352" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="304" width="352" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="672" y="310" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="690" y="319" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SLOT</text>
      <text x="840" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MapaToolbar</text>
      <text x="840" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Toolbar · paleta RPG + alinhar/distribuir</text>

      <!-- ControleZoom -->
      <rect x="664" y="384" width="352" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="384" width="352" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="672" y="390" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="690" y="399" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SLOT</text>
      <text x="840" y="418" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ControleZoom</text>
      <text x="840" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NavigationPanel · % · 100% · caber</text>

      <!-- MapaOverlay -->
      <rect x="664" y="464" width="352" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="464" width="352" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="672" y="470" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="690" y="479" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SLOT</text>
      <text x="840" y="498" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MapaOverlay</text>
      <text x="840" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">InFrontOfTheCanvas · medidas · réguas</text>

      <!-- ============ LEGENDA ============ -->
      <line x1="40" y1="568" x2="1080" y2="568" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="128" y="580" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="146" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ORQUESTRA</text>

      <rect x="264" y="580" width="10" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="282" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">COMPONENTE REACT</text>

      <rect x="456" y="580" width="10" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="474" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ESTADO</text>

      <rect x="576" y="580" width="10" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="594" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">TLDRAW / DISCO</text>

      <line x1="736" y1="584" x2="768" y2="584" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="776" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">VOLTA PELO CONTEXTO REACT</text>
    </svg>
  </div>
</body>
</html>
