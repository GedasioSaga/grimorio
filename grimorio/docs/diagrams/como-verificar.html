<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Como Verificar a Interface</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:   #f5f5f5;
    --color-ink:     #2d3142;
    --color-muted:   #4f5d75;
    --color-accent:  #eb6c36;
    --font-sans:     'Geist', system-ui, sans-serif;
    --font-serif:    'Instrument Serif', serif;
    --font-mono:     'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-family: var(--font-sans);
    font-size: 0.9rem;
    color: var(--color-muted);
    margin-bottom: 1.5rem;
    max-width: 680px;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Flowchart · Grimório</p>
  <h1>Como verificar a interface — Tauri não abre em browser comum</h1>
  <p class="subtitle">Tudo passa por invoke() (fsBridge.ts) e o seletor de cofre usa dialog nativo — por isso existem dois harnesses paralelos, um para catálogo estático de peças e outro para comportamento interativo.</p>

  <svg viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ===== Arrows (behind nodes) ===== -->

    <!-- Start -> Warning -->
    <line x1="520" y1="96" x2="520" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Warning -> Decision -->
    <line x1="520" y1="184" x2="520" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Decision -> gen step (left branch: catálogo) -->
    <path d="M 380,268 H 198 Q 190,268 190,276 V 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="228" y="248" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="256" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PEÇAS</text>

    <!-- Decision -> open step (right branch: comportamento) -->
    <path d="M 660,268 H 842 Q 850,268 850,276 V 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="736" y="248" width="112" height="12" rx="2" fill="#f5f5f5"/>
    <text x="792" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMPORTAMENTO</text>

    <!-- Branch A: gen -> serve -> end -->
    <line x1="190" y1="428" x2="190" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="190" y1="524" x2="190" y2="556" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Branch B: open -> scene -> end (coral, happy path) -->
    <line x1="850" y1="428" x2="850" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="850" y1="524" x2="850" y2="556" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- ===== Nodes ===== -->

    <!-- Start (oval) -->
    <rect x="420" y="40" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="520" y="73" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quer verificar a UI?</text>

    <!-- Warning (boundary — dashed accent) -->
    <rect x="420" y="128" width="200" height="56" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="520" y="154" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Não abra localhost:1420</text>
    <text x="520" y="170" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">VaultPicker exige dialog nativo</text>

    <!-- Decision -->
    <polygon points="520,216 660,268 520,320 380,268" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="520" y="264" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">O que você quer</text>
    <text x="520" y="278" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">verificar?</text>

    <!-- Branch A: gen step -->
    <rect x="80" y="372" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="190" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">amostraMapa.test.ts</text>
    <text x="190" y="414" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">gera .amostra/mapa.html</text>

    <!-- Branch A: serve step (external / node script) -->
    <rect x="80" y="460" width="220" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <rect x="88" y="468" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
    <text x="108" y="477" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
    <text x="190" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">servirAmostra.mjs</text>
    <text x="190" y="512" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">porta 4599 (Playwright recusa file://)</text>

    <!-- Branch A: end (oval) -->
    <rect x="80" y="556" width="220" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="190" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Screenshot de peça</text>
    <text x="190" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">catálogo, sem interação</text>

    <!-- Branch B: open step -->
    <rect x="740" y="372" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="850" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">amostra.html</text>
    <text x="850" y="414" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">dev server Vite — porta 1420</text>

    <!-- Branch B: scene step -->
    <rect x="740" y="460" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="850" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">#ficha · #mapa · #opcoes</text>
    <text x="850" y="502" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">hash routing — AmostraApp.tsx</text>

    <!-- Branch B: end (focal — coral) -->
    <rect x="740" y="556" width="220" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="850" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">window.__editorMapa</text>
    <text x="850" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">só na bancada — nunca no app</text>

    <!-- ===== Legend ===== -->
    <line x1="40" y1="644" x2="1000" y2="644" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="40" y="660" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

    <rect x="40" y="676" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="72" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Início / fim (oval)</text>

    <rect x="220" y="676" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="252" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Passo (retângulo)</text>

    <polygon points="412,682 424,676 436,682 424,688" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="448" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decisão (losango)</text>

    <rect x="580" y="676" width="24" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="612" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Aviso / limite</text>

    <line x1="760" y1="684" x2="788" y2="684" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="796" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Bancada interativa</text>
  </svg>
</div>

</body>
</html>
