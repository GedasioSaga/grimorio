[package]
name = "grimorio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grimorio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-http = "2"
base64 = "0.22.1"
tauri-plugin-process = "2"
sha2 = "0.10"
oauth2 = "5"
keyring = "4"
tauri-plugin-oauth = "2"
# Mesma versao que o tauri-plugin-http ja traz (0.12.x): reusar evita uma segunda copia
# do reqwest no binario. `default-features = false` mantem o TLS em rustls, que e o unico
# stack de TLS presente na arvore hoje.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
# Ja esta na arvore via tauri; declarado aqui so pelo canal oneshot e pelo timeout do login.
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

